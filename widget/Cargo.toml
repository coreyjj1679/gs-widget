[package]
name = "gersang-widget"
version = "1.0.1"
edition = "2021"
rust-version = "1.92"
description = "Small dark Gersang reference widget"

[dependencies]
slint = "1.9"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSResponder", "NSScreen", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }

[build-dependencies]
slint-build = "1.9"
winresource = "0.1"

[package.metadata.slint]
style = "fluent-dark"
