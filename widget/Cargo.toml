[package]
name = "gersang-widget"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Small dark Gersang reference widget"

[dependencies]
slint = "1.9"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
unicode-normalization = "0.1"

[build-dependencies]
slint-build = "1.9"
winresource = "0.1"

[package.metadata.slint]
style = "fluent-dark"
