[package]
name = "gersang-widget"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Small dark Gersang reference widget"

[dependencies]
slint = "1.9"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSResponder", "NSScreen", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }

[build-dependencies]
slint-build = "1.9"
winresource = "0.1"

[package.metadata.slint]
style = "fluent-dark"
