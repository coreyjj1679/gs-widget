name: Windows build and release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # The tag and origin/main ancestry require complete history.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Require the tagged commit to be on origin/main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_ref.py --tag "$env:RELEASE_TAG"
      - name: Validate package version and tag
        id: version
        env:
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = python scripts/package_windows.py --version-only --expected-tag "$env:EXPECTED_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Install pinned Rust toolchain
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target $env:WINDOWS_TARGET --no-self-update
      - name: Test packaging privacy and release publication guards
        run: python -m unittest discover -s scripts/tests -v
      - name: Test Windows app and updater
        run: cargo +$env:RUST_TOOLCHAIN test --locked --manifest-path widget/Cargo.toml --target $env:WINDOWS_TARGET -- --skip battle_frames_skip_blanks_and_reuse_the_decoded_frame
      - name: Build Windows release
        run: cargo +$env:RUST_TOOLCHAIN build --locked --release --manifest-path widget/Cargo.toml --target $env:WINDOWS_TARGET
      - name: Package Windows ZIP
        env:
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_windows.py --expected-tag "$env:EXPECTED_TAG"
      - name: Smoke test the extracted ZIP away from the source checkout
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "gs-widget-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          $archive = @(Get-ChildItem dist/gs-widget-*-windows-x64.zip)
          if ($archive.Count -ne 1) { throw "Expected exactly one release archive" }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath "$smoke/app"
          $env:LOCALAPPDATA = Join-Path $smoke "profile"
          $env:GERSANG_DB = $null
          $env:GERSANG_CLIENT = $null
          $process = Start-Process -FilePath "$smoke/app/gersang-widget.exe" -ArgumentList "--check-installation" -WorkingDirectory $env:RUNNER_TEMP -PassThru -RedirectStandardOutput "$smoke/stdout.txt" -RedirectStandardError "$smoke/stderr.txt"
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Packaged app did not finish its installation check within 30 seconds"
          }
          Get-Content "$smoke/stdout.txt", "$smoke/stderr.txt"
          if ($process.ExitCode -ne 0) { throw "Packaged app installation check failed: $($process.ExitCode)" }
      - name: Verify the packaged GUI stays usable with the network unavailable
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "gs-widget-smoke"
          ./scripts/smoke_windows_offline.ps1 -ExePath "$smoke/app/gersang-widget.exe" -LocalAppData "$smoke/profile" -WorkingDirectory $env:RUNNER_TEMP
      - name: Save downloadable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: dist/gs-widget-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Recheck main ancestry and the built commit before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: python scripts/check_release_ref.py --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: dist
      - name: Upload as draft, verify digest, then publish with an empty body
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python scripts/publish_release.py
          --repository "$RELEASE_REPOSITORY"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"
          --archive "dist/gs-widget-v$RELEASE_VERSION-windows-x64.zip"
