name: Windows public update UI test

on:
  push:
    branches: ["codex/test-live-update"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-live-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-update:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate the real UI test harness
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @("smoke_windows_live_update.ps1", "windows_update_ui.ps1", "windows_gui_test_helpers.ps1")) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/scripts/$script", [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          python -m py_compile scripts/windows_live_update_fixture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the immutable published v1.0.0 baseline
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/public-update-input" -Force | Out-Null
          $archive = "$env:RUNNER_TEMP/public-update-input/v1.0.0.zip"
          Invoke-WebRequest -Uri "https://github.com/coreyjj1679/gs-widget/releases/download/v1.0.0/gs-widget-v1.0.0-windows-x64.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "5e036aad294b60cab04f4ca22271f28bedd5b47e281cced5a463561f88230098") {
            throw "Published v1.0.0 archive digest mismatch"
          }
      - name: Use the real app to check, download and restart into the public v1.0.1
        env:
          CI_RELEASE_TOKEN: ${{ github.token }}
        run: |
          ./scripts/smoke_windows_live_update.ps1 -BaselineZip "$env:RUNNER_TEMP/public-update-input/v1.0.0.zip" -TestRoot "$env:RUNNER_TEMP/public update UI" -TargetVersion "1.0.1" -WaitForReleaseMinutes 40
      - name: Save real update UI and data-preservation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-public-update-ui-evidence
          path: |
            ${{ runner.temp }}/public update UI/**/*.json
            ${{ runner.temp }}/public update UI/**/*.png
            ${{ runner.temp }}/public update UI/**/*.log
            ${{ runner.temp }}/public update UI/**/error.txt
            ${{ runner.temp }}/public update UI/**/completed
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
