name: Windows public update UI test

on:
  push:
    branches: ["codex/test-live-update"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-live-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect the actual published v1.0.0 Windows UI
        run: |
          . ./scripts/windows_gui_test_helpers.ps1
          $root = Join-Path $env:RUNNER_TEMP "public update UI"
          New-Item -ItemType Directory -Path "$root/profile/gs-widget" -Force | Out-Null
          $archive = Join-Path $root "v1.0.0.zip"
          Invoke-WebRequest -Uri "https://github.com/coreyjj1679/gs-widget/releases/download/v1.0.0/gs-widget-v1.0.0-windows-x64.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "5e036aad294b60cab04f4ca22271f28bedd5b47e281cced5a463561f88230098") {
            throw "Published v1.0.0 archive digest mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath "$root/app with spaces"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText("$root/profile/gs-widget/ui-lang.txt", "en-zh", $utf8)
          [System.IO.File]::WriteAllText("$root/profile/gs-widget/view.txt", "pin=off`nbattle=0`ngallery=1`nanimate=0`nhotkeys=0`nlegacy=0`n", $utf8)
          [System.IO.File]::WriteAllText("$root/profile/gs-widget/window.txt", "size=560,600`npos=32,32`nmode=widget`nfull-pos=48,48`nfull-size=1120,720`n", $utf8)
          $env:LOCALAPPDATA = "$root/profile"
          $env:GERSANG_DB = $null
          $env:GERSANG_CLIENT = $null
          $env:SLINT_BACKEND = "winit-software"
          $env:SLINT_RENDERER = "software"
          $app = Start-Process -FilePath "$root/app with spaces/gersang-widget.exe" -WorkingDirectory $root -PassThru -RedirectStandardOutput "$root/stdout.log" -RedirectStandardError "$root/stderr.log"
          try {
            Wait-Gui -AppProcess $app
            Assert-GuiResponsive -AppProcess $app -Seconds 3
            ./scripts/windows_update_ui.ps1 -Mode Inspect -ProcessId $app.Id -OutputDirectory "$root/01-initial"
            Close-Gui -AppProcess $app
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) { $app.Kill(); $null = $app.WaitForExit(5000) }
            $app.Dispose()
          }
      - name: Save UI test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-public-update-ui-evidence
          path: |
            ${{ runner.temp }}/public update UI/**/*.json
            ${{ runner.temp }}/public update UI/**/*.png
            ${{ runner.temp }}/public update UI/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
