name: Windows bilingual changelog

# This verifies PRs without creating a tag or Release.
on:
  pull_request:
    paths:
      - ".github/workflows/changelog.yml"
      - ".github/workflows/windows.yml"
      - ".cargo/**"
      - "release-notes.json"
      - "scripts/**"
      - "widget/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-changelog-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  changelog:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate the native UI test scripts
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @("smoke_windows_changelog.ps1", "windows_update_ui.ps1", "windows_gui_test_helpers.ps1")) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/scripts/$script", [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Test packaging and English release publication
        run: python -m unittest discover -s scripts/tests -v
      - name: Install pinned Rust toolchain
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target $env:WINDOWS_TARGET --no-self-update
      - name: Test Windows app, updater and bundled bilingual history
        run: cargo +$env:RUST_TOOLCHAIN test --locked --manifest-path widget/Cargo.toml --target $env:WINDOWS_TARGET -- --skip battle_frames_skip_blanks_and_reuse_the_decoded_frame
      - name: Build Windows app for native UI verification
        run: cargo +$env:RUST_TOOLCHAIN build --locked --manifest-path widget/Cargo.toml --target $env:WINDOWS_TARGET
      - name: Save the tested executable for UI diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-changelog-test-app
          path: widget/target/x86_64-pc-windows-msvc/debug/gersang-widget.exe
          if-no-files-found: error
          retention-days: 1
      - name: Read both languages and window modes with network requests blocked
        run: |
          ./scripts/smoke_windows_changelog.ps1 -ExePath "$env:GITHUB_WORKSPACE/widget/target/$env:WINDOWS_TARGET/debug/gersang-widget.exe" -RepositoryRoot "$env:GITHUB_WORKSPACE" -TestRoot "$env:RUNNER_TEMP/bilingual changelog"
      - name: Save native UI screenshots, trees and test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bilingual-changelog-evidence
          path: |
            ${{ runner.temp }}/bilingual changelog/**/*.json
            ${{ runner.temp }}/bilingual changelog/**/*.png
            ${{ runner.temp }}/bilingual changelog/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
